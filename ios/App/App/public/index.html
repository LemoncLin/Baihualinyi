<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="icon" type="image/png" href="/bhly/方形logo.png">
  <link rel="apple-touch-icon" href="/bhly/方形logo.png">
  <title>白桦林奕</title>

  <!-- 微信/链接分享：必须写死在 HTML 里，爬虫不会执行下面的 JS -->
  <meta name="description" content="白桦林奕 · 项目展示">
  <meta property="og:title" content="白桦林奕">
  <meta property="og:description" content="白桦林奕 · 项目展示">
  <meta property="og:image" content="http://admin.top-realm.cn/bhly/方形logo.png">
  <meta property="og:image:width" content="300">
  <meta property="og:image:height" content="300">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://admin.top-realm.cn/bhly/index.html">
  <meta itemprop="name" content="白桦林奕">
  <meta itemprop="description" content="白桦林奕 · 项目展示">
  <meta itemprop="image" content="http://admin.top-realm.cn/bhly/方形logo.png">

  <script>
    (function() {
      const ogUrl = document.querySelector('meta[property="og:url"]')
      if (ogUrl) {
        const clean = window.location.href.split('#')[0]
        ogUrl.setAttribute('content', clean)
      }
    })()
  </script>

  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
      background: #000;
    }
    #splash-boot {
      position: fixed;
      inset: 0;
      z-index: 4999;
      background: #000;
      overflow: hidden;
    }
    #splash-boot-poster,
    #splash-boot-anim,
    #splash-boot-video,
    #splash-boot-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      background: #000;
      pointer-events: none;
    }
    #splash-boot-poster { z-index: 0; }
    #splash-boot-video {
      z-index: 1;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    #splash-boot-canvas {
      z-index: 2;
      display: none;
    }
    #splash-boot-anim {
      z-index: 3;
      display: none;
      object-fit: cover;
    }
  </style>
  <script type="module" crossorigin src="/bhly/assets/index.d35a3c9c.js"></script>
  <link rel="stylesheet" href="/bhly/assets/index.3f3d29cf.css">
</head>
<body>
  <div id="splash-boot">
    <!-- 不再预挂旧 splash-m 海报/动图，避免先闪旧开屏 -->
    <img id="splash-boot-poster" alt="" draggable="false" style="display:none" />
    <img id="splash-boot-anim" alt="" draggable="false" style="display:none" />
    <video
      id="splash-boot-video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      x5-playsinline
      x5-video-player-type="h5"
      x5-video-player-fullscreen="false"
      x5-video-orientation="portrait"
      preload="auto"
    ></video>
    <canvas id="splash-boot-canvas" aria-hidden="true"></canvas>
  </div>

  <script>
    /**
     * 开屏策略：
     * - 先按设备写入正确 src，再播（避免 HTML 默认竖屏片 / 旧 poster 闪一下）
     * - play() 写在 WeixinJSBridge.invoke('getNetworkType') 回调里
     * - 手机：竖屏LOGO；iPad / EXE：4Klogo（不再回退旧 splash-m.webp）
     */
    (function () {
      var v = document.getElementById('splash-boot-video')
      var canvas = document.getElementById('splash-boot-canvas')
      var poster = document.getElementById('splash-boot-poster')
      var anim = document.getElementById('splash-boot-anim')
      if (!v) return

      var ua = navigator.userAgent || ''
      var phone = /iPhone|iPod|Android.*Mobile|Mobile.*Android/i.test(ua)
      var isWeChat = /MicroMessenger/i.test(ua)
      var isAndroid = /Android/i.test(ua)
      var isWeChatAndroid = isWeChat && isAndroid
      var src = phone
        ? '/bhly/%E7%B4%A0%E6%9D%90/%E7%AB%96%E5%B1%8FLOGO.mp4?v=logo3'
        : '/bhly/%E7%B4%A0%E6%9D%90/4Klogo.mp4?v=logo3'

      window.__splashUseAnim = false
      window.__splashAnimDuration = 8500
      // 给 Vue SplashIntro 对齐，避免挂载时再改 src 重载闪一下
      window.__splashBootSrc = src

      function forceMute() {
        v.muted = true
        v.defaultMuted = true
        v.volume = 0
        v.setAttribute('muted', 'muted')
        v.setAttribute('autoplay', 'autoplay')
        v.setAttribute('playsinline', 'true')
        v.setAttribute('webkit-playsinline', 'true')
        v.setAttribute('x5-playsinline', 'true')
        v.setAttribute('x5-video-player-type', 'h5')
        v.setAttribute('x5-video-player-fullscreen', 'false')
        v.setAttribute('x5-video-orientation', 'portrait')
      }

      if (poster) poster.style.display = 'none'
      if (anim) anim.style.display = 'none'
      v.removeAttribute('poster')

      /* —— 全端统一播新 logo 视频（含安卓微信） —— */
      forceMute()
      v.setAttribute('src', src)
      v.playsInline = true

      var painting = false
      var paintRaf = 0

      function stopCanvasPaint() {
        painting = false
        if (paintRaf) cancelAnimationFrame(paintRaf)
        paintRaf = 0
      }

      function startCanvasPaint() {
        // 仅安卓非微信等极端黑屏时用；安卓微信已走 webp
        if (!canvas || painting || isWeChatAndroid) return
        if (v.paused || v.currentTime < 0.01) return
        var ctx = canvas.getContext('2d')
        if (!ctx) return
        painting = true
        canvas.style.display = 'block'
        v.style.opacity = '0'
        if (poster) poster.style.opacity = '0'
        function tick() {
          if (!painting || v.paused || v.ended) return
          var vw = v.videoWidth
          var vh = v.videoHeight
          if (vw > 0 && vh > 0) {
            if (canvas.width !== vw || canvas.height !== vh) {
              canvas.width = vw
              canvas.height = vh
            }
            try {
              ctx.drawImage(v, 0, 0, vw, vh)
            } catch (e) {}
          }
          paintRaf = requestAnimationFrame(tick)
        }
        tick()
      }

      window.__splashStopCanvasPaint = stopCanvasPaint

      /** FAQ 标准：play 只能写在 getNetworkType 回调内 */
      function playInWxCallback() {
        forceMute()
        try {
          var p = v.play()
          if (p && p.catch) p.catch(function () {})
        } catch (e) {}
      }

      function wxUnlockPlay() {
        try {
          WeixinJSBridge.invoke('getNetworkType', {}, function () {
            playInWxCallback()
          })
        } catch (e) {
          playInWxCallback()
        }
      }

      function bindWxBridge() {
        if (typeof WeixinJSBridge !== 'undefined') {
          wxUnlockPlay()
        } else {
          document.addEventListener('WeixinJSBridgeReady', wxUnlockPlay, false)
        }
      }

      window.__splashForcePlay = function () {
        if (isWeChat) wxUnlockPlay()
        else playInWxCallback()
      }

      v.addEventListener('playing', startCanvasPaint)
      v.addEventListener('timeupdate', function onTu() {
        if (v.currentTime > 0.05) {
          startCanvasPaint()
          v.removeEventListener('timeupdate', onTu)
        }
      })

      if (isWeChat) {
        // iOS 微信等：严格按 FAQ，只走 Bridge
        bindWxBridge()
        // 仍保留触摸兜底（安卓非 X5 或 Bridge 失败时）
        document.addEventListener(
          'touchstart',
          function () {
            wxUnlockPlay()
          },
          { once: true, capture: true, passive: true }
        )
      } else {
        playInWxCallback()
        v.addEventListener('canplay', playInWxCallback)
        v.addEventListener('loadeddata', playInWxCallback)
      }
    })()
  </script>

  <div id="app"></div>
  
</body>
</html>
