# =============================================================================
# 工作流名称: iOS 构建并上传 TestFlight
# 触发方式 : 手动触发（workflow_dispatch），每次运行构建号(CURRENT_PROJECT_VERSION)
#            自动 +1，避免 TestFlight 因重复构建号拒收。
# 运行环境 : GitHub 托管的 macOS Runner（自带 Xcode）
# 前置 Secret（在仓库 Settings → Secrets and variables → Actions 配置）:
#   BUILD_CERTIFICATE_BASE64   Base64 编码的发布证书 .p12
#   P12_PASSWORD               .p12 导出密码
#   PROVISION_PROFILE_BASE64   Base64 编码的 App Store 描述文件 .mobileprovision
#   APP_STORE_CONNECT_API_KEY  App Store Connect API 私钥文件 .p8 的内容
#   APP_STORE_CONNECT_KEY_ID   上述密钥的 Key ID
#   APP_STORE_CONNECT_ISSUER_ID  Issuer ID
# =============================================================================
name: 构建并上传 TestFlight

on:
  # 仅允许在 Actions 页面手动触发，并可选择是否真正上传
  workflow_dispatch:
    inputs:
      skip_upload:
        description: "只构建导出 IPA，不上传 TestFlight（用于验证流程）"
        type: boolean
        default: false
      marketing_version:
        description: "可选：覆盖营销版本号(如 1.1.0)，留空则沿用工程内设置"
        required: false
        default: ""

# 同分支并发时取消旧任务，避免重复上传
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  # 工程固定参数，与 project.pbxproj 保持一致
  PROJECT_PATH: ios/App/App.xcodeproj
  SCHEME: App
  CONFIGURATION: Release
  # 导出 IPA 的输出目录
  EXPORT_PATH: output/export
  # Apple 开发者团队 ID（10 位，如 A1B2C3D4E5），建议在仓库 Variables 中配置
  # 也可直接把下面的值写死为你的 Team ID
  DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}

jobs:
  build-and-upload:
    name: 归档、导出 IPA 并上传
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # 1. 拉取仓库代码
      # -----------------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. 选择 Xcode 版本并输出基础环境信息，便于排查问题
      # -----------------------------------------------------------------------
      - name: 选择 Xcode 并打印环境
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || true
          xcodebuild -version
          swift --version

      # -----------------------------------------------------------------------
      # 2.5 从 GitHub Release 下载大文件资产包并原位还原
      #     超过 GitHub 100MB 推送限制的视频/大图不进 Git，统一托管在 Release。
      #     下载后按 manifest 校验 SHA256，确保资源完整、未被篡改。
      # -----------------------------------------------------------------------
      - name: 下载并还原大文件资源
        env:
          # 资产包所在 Release 的 tag，可在仓库 Variables 中覆盖
          ASSET_RELEASE_TAG: ${{ vars.ASSET_RELEASE_TAG || 'v1.0-assets' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSET_NAME="large-assets.tar.gz"
          ASSET_DIR="release-assets"
          mkdir -p "$ASSET_DIR"

          echo "==> 从 Release [$ASSET_RELEASE_TAG] 下载 $ASSET_NAME"
          # gh CLI 会自动使用内置 GITHUB_TOKEN，无需额外鉴权
          gh release download "$ASSET_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$ASSET_DIR" \
            --clobber

          echo "==> 解压到 ios/ 目录（包内为相对路径）"
          tar -xzf "$ASSET_DIR/$ASSET_NAME" -C ios

          echo "==> 按 manifest 校验 SHA256"
          cd ios
          if [ -f "../$ASSET_DIR/large-assets.manifest.txt" ]; then
            # sha256sum -c 逐个比对，任一不符立即失败
            sha256sum -c "../$ASSET_DIR/large-assets.manifest.txt"
          else
            echo "::warning::未找到 manifest，跳过校验（建议提交 large-assets.manifest.txt）"
          fi
          cd ..
          echo "==> 大文件还原完成，当前工程体积:"
          du -sh ios

      # -----------------------------------------------------------------------
      # 3. 构建号自动递增：读取当前 CURRENT_PROJECT_VERSION 并 +1
      #    通过 xcconfig 覆盖，不直接改动工程文件，保持仓库干净
      # -----------------------------------------------------------------------
      - name: 计算递增构建号
        id: build_number
        run: |
          # 从工程文件中提取当前构建号（取第一个匹配值）
          CURRENT=$(grep -m1 "CURRENT_PROJECT_VERSION" \
            "$PROJECT_PATH/project.pbxproj" | sed 's/[^0-9]//g')
          NEXT=$((CURRENT + 1))
          echo "当前构建号=$CURRENT，本次构建号=$NEXT"
          echo "build_number=$NEXT" >> "$GITHUB_OUTPUT"
          # 写入临时 xcconfig，构建时通过 -xcconfig 注入覆盖
          echo "CURRENT_PROJECT_VERSION = $NEXT" > /tmp/ci-override.xcconfig
          if [ -n "${{ inputs.marketing_version }}" ]; then
            echo "MARKETING_VERSION = ${{ inputs.marketing_version }}" >> /tmp/ci-override.xcconfig
          fi
          cat /tmp/ci-override.xcconfig

      # -----------------------------------------------------------------------
      # 4. 安装发布证书与描述文件（逻辑封装在独立脚本中）
      # -----------------------------------------------------------------------
      - name: 安装签名证书与描述文件
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          # 临时钥匙串仅在本次 Runner 生命周期内有效，随机生成即可，无需用户配置
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          chmod +x scripts/import_certificate.sh
          ./scripts/import_certificate.sh

      # -----------------------------------------------------------------------
      # 5. 解析 Swift Package Manager 依赖（Capacitor 远程包），提前暴露网络问题
      # -----------------------------------------------------------------------
      - name: 解析 SPM 依赖
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME"

      # -----------------------------------------------------------------------
      # 6. 归档（Archive）：使用手动签名，描述文件由环境变量指定
      # -----------------------------------------------------------------------
      - name: 归档 Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath output/App.xcarchive \
            -xcconfig /tmp/ci-override.xcconfig \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            clean archive

      # -----------------------------------------------------------------------
      # 7. 导出 IPA：使用仓库内的 ExportOptions.plist（app-store 方式）
      # -----------------------------------------------------------------------
      - name: 导出 IPA
        run: |
          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath output/App.xcarchive \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -allowProvisioningUpdates

      - name: 查看产物
        run: |
          ls -lh "$EXPORT_PATH"
          # 显示 IPA 内的签名信息，确认描述文件与 Bundle ID 正确
          unzip -p "$EXPORT_PATH/App.ipa" "Payload/App.app/embedded.mobileprovision" \
            | security cms -D -d 2>/dev/null | /usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" /dev/stdin || true

      # -----------------------------------------------------------------------
      # 8. 上传 IPA 到 App Store Connect（TestFlight）
      #    使用官方 xcrun altool/API Key 认证，无需 Apple ID 双因素密码
      # -----------------------------------------------------------------------
      - name: 上传 TestFlight
        if: ${{ inputs.skip_upload == false }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # App Store Connect API 私钥需放入固定文件名目录
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$APP_STORE_CONNECT_API_KEY" > "$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

          # xcrun altool 通过 --apiKey/--apiIssuer 自动查找上述私钥
          xcrun altool --upload-app \
            --type ios \
            --file "$EXPORT_PATH/App.ipa" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

      # -----------------------------------------------------------------------
      # 9. 无论成功失败都上传 IPA 作为构建产物，方便手动下载验证
      # -----------------------------------------------------------------------
      - name: 归档 IPA 为构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ steps.build_number.outputs.build_number }}.ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 14
          if-no-files-found: ignore
